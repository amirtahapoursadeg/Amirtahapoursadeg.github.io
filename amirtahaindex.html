<title>Digital Contact Plate | امیر طاها پورصادق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f3f9ef; --card:#ffffff; --card2:#fafdf8; --line:#d9e8d2;
  --pink:#ec7c93; --pink2:#f7b9c6; --leaf:#4f9d69; --leaf2:#a9d6b0; --butter:#f6df88;
  --text:#1e3a2a; --muted:#69836f; --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#e6f1df}
body{font-family:'Vazirmatn',system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;min-height:100dvh}
button,a{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{font-size:16px}

.plate{
  width:100%;max-width:460px;min-height:100dvh;position:relative;overflow:hidden;isolation:isolate;
  padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(34px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(300px 260px at 0% 0%,rgba(247,185,198,.55),transparent 70%),
    radial-gradient(320px 280px at 100% 18%,rgba(169,214,176,.55),transparent 70%),
    radial-gradient(360px 300px at 0% 100%,rgba(246,223,136,.35),transparent 70%),
    radial-gradient(300px 260px at 100% 100%,rgba(247,185,198,.4),transparent 70%),
    var(--bg);
  border-inline:1px solid var(--line);
}
.plate::before{content:"";position:absolute;inset:12px;border:1.5px dashed rgba(79,157,105,.25);border-radius:30px;pointer-events:none;z-index:-1}

.avatar{width:148px;height:148px;margin:0 auto;position:relative;border-radius:50%}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 200deg,var(--pink),var(--butter),var(--leaf2),var(--leaf),var(--pink2),var(--pink));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  animation:ring 1.1s var(--ease) both}
.avatar::after{content:"";position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(closest-side,rgba(236,124,147,.22),transparent);z-index:-1}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid #fff;box-shadow:0 10px 30px -10px rgba(79,157,105,.5)}
@keyframes ring{from{transform:rotate(-120deg) scale(.86);opacity:0}to{transform:none;opacity:1}}

.eyebrow{margin-top:30px;display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr;
  font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.34em;font-size:14px;color:var(--leaf)}
.eyebrow::before,.eyebrow::after{content:"";width:30px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--leaf2))}
.eyebrow::after{transform:scaleX(-1)}
h1{margin-top:14px;text-align:center;font-weight:800;font-size:31px;line-height:1.35;color:var(--text)}
.latin{margin-top:6px;text-align:center;direction:ltr;font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.26em;font-size:17px;color:var(--leaf)}
.bio{margin-top:12px;text-align:center;color:var(--muted);font-size:14.5px}
.flower{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px 0 24px}
.flower i{width:56px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--leaf2))}
.flower i:last-child{transform:scaleX(-1)}
.flower svg{width:24px;height:24px}

.qr-wrap{width:min(72%,270px);margin:0 auto;position:relative;padding:14px}
.qr-wrap>i{position:absolute;width:26px;height:26px;border:2.5px solid var(--pink)}
.qr-wrap>i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.qr-wrap>i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.qr-wrap>i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.qr-wrap>i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.qr{background:#fff;border-radius:14px;padding:14px;aspect-ratio:1;display:flex;box-shadow:0 18px 40px -20px rgba(79,157,105,.55),0 0 0 1px var(--line)}
.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.hint{margin:16px 0 24px;text-align:center;color:var(--muted);font-size:13.5px}

.row{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:11px;padding:12px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 8px 22px -16px rgba(79,157,105,.5);
  color:inherit;text-decoration:none;font:inherit;text-align:start;cursor:pointer;
  transition:transform .16s var(--ease),border-color .2s,box-shadow .2s}
.row:active,.btn:active,.copy:active{transform:scale(.975)}
.row:focus-visible,.btn:focus-visible,.copy:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;background:#eef7ea;border:1px solid var(--line);color:var(--leaf)}
.ico svg{width:24px;height:24px}
.txt{flex:1;min-width:0}
.txt small{display:block;color:var(--muted);font-size:12px;margin-bottom:1px}
.txt strong{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt strong.ltr{direction:ltr;text-align:right}
.acts{display:flex;align-items:center;gap:8px;color:var(--pink)}
.go{font-size:17px;width:16px;text-align:center}
.copy{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#eef7ea;border:1px solid var(--line);color:var(--leaf);cursor:pointer;transition:transform .16s var(--ease),color .2s,border-color .2s,background .2s}
.copy svg{width:18px;height:18px}
.copy.ok{color:#fff;background:var(--leaf);border-color:var(--leaf)}
.row.locked .ico{background:#fdeef1;color:var(--pink);border-color:#f7d3db}
.row.open{border-color:var(--pink2);box-shadow:0 0 0 3px rgba(247,185,198,.35),0 12px 26px -16px rgba(236,124,147,.7)}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{padding:13px 10px;border-radius:17px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--leaf);background:var(--card);border:1px solid var(--line);transition:transform .16s var(--ease),border-color .2s}
.btn.primary{color:#fff;background:linear-gradient(180deg,#f08fa4,var(--pink));border-color:transparent;box-shadow:0 10px 22px -12px rgba(236,124,147,.9)}

@media (hover:hover) and (pointer:fine){
  .row:hover,.btn:hover{border-color:var(--leaf2)}
  .copy:hover{border-color:var(--leaf2)}
}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--leaf);color:#fff;padding:10px 20px;border-radius:14px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{margin:auto auto calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);background:#fff;color:var(--text);border-radius:26px;padding:26px 22px 20px;width:min(92vw,370px);box-shadow:0 30px 60px -20px rgba(30,58,42,.5)}
dialog[open]{animation:sheet .3s var(--ease)}
dialog::backdrop{background:rgba(30,58,42,.45);backdrop-filter:blur(4px)}
@keyframes sheet{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
dialog h2{font-size:17px;font-weight:600;text-align:center}
dialog p{color:var(--muted);font-size:13.5px;text-align:center;margin:6px 0 18px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:6px;direction:ltr}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--pink2);transition:background .15s,transform .15s var(--ease)}
.dots span.on{background:var(--pink);border-color:var(--pink);transform:scale(1.15)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#pinIn{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 4px;direction:ltr}
.pad button{height:50px;border-radius:15px;background:#eef7ea;border:1px solid var(--line);color:var(--text);font:inherit;font-size:21px;cursor:pointer;transition:transform .12s var(--ease),background .15s}
.pad button:active{transform:scale(.94);background:var(--leaf2)}
.err{min-height:20px;margin:8px 0 2px;text-align:center;color:#d4506a;font-size:13px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  <p>رمز رو وارد کن تا شماره نمایش داده بشه</p>
  <div class="dots" id="dots"></div>
  <input id="pinIn" type="tel" inputmode="numeric" autocomplete="off" aria-label="رمز">
  <div class="err" id="pinErr"></div>
  <div class="pad" id="pad"></div>
  <div class="btns" style="margin-top:12px"><button class="btn" id="pinCancel" type="button" style="grid-column:1/-1">بستن</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ====== تنظیمات: فقط این بخش رو عوض کن ====== */
const CONFIG = {
  nameFa: "امیر طاها پورصادق",
  phone: "+989149210721",
  phoneShown: "+98 914 921 0721",
  pin: "2010",              // رمز باز شدن شماره
  instagram: "taha.poursadeg",
  telegram: "ll20l10ll",
  channel: "Hale_man0",
  pageUrl: "https://tahapoursadeg.github.io/"
};
/* ============================================ */
const $ = id => document.getElementById(id);
const igUrl = "https://instagram.com/" + CONFIG.instagram;
const tgUrl = "https://t.me/" + CONFIG.telegram;
const chUrl = "https://t.me/" + CONFIG.channel;
$("igRow").href = igUrl; $("tgRow").href = tgUrl; $("chRow").href = chUrl;
let unlocked = false;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
async function copyText(s,btn){
  try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
  toast("کپی شد");
  if(btn){btn.classList.add("ok");setTimeout(()=>btn.classList.remove("ok"),1200)}
}
document.querySelectorAll(".copy[data-copy]").forEach(b=>b.addEventListener("click",e=>{
  e.preventDefault();e.stopPropagation();copyText({ig:igUrl,tg:tgUrl,ch:chUrl}[b.dataset.copy],b);
}));

/* QR */
try{
  new QRCode($("qr"),{text:CONFIG.pageUrl||location.href,width:320,height:320,colorDark:"#1e3a2a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}catch(e){$("qr").closest(".qr-wrap").style.display="none"}

/* Phone lock */
const dlg=$("pinDlg"),pinIn=$("pinIn"),len=CONFIG.pin.length;
$("dots").innerHTML="<span></span>".repeat(len);
$("pad").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button type="button" data-k="${k}">${k}</button>`).join("");
function paint(){[...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i<pinIn.value.length))}
function openPin(){pinIn.value="";$("pinErr").textContent="";paint();dlg.showModal()}
function check(){
  if(pinIn.value.length<len)return;
  if(pinIn.value===CONFIG.pin){unlock()}
  else{
    $("pinErr").textContent="رمز اشتباهه";
    const d=$("dots");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");
    if(navigator.vibrate)navigator.vibrate(60);
    setTimeout(()=>{pinIn.value="";paint()},350);
  }
}
function unlock(){
  unlocked=true;dlg.close();
  const r=$("phoneRow");r.classList.remove("locked");r.classList.add("open");
  $("phoneVal").textContent=CONFIG.phoneShown;$("phoneVal").classList.add("ltr");
  $("phoneIco").innerHTML='<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>';
  $("phoneCopy").hidden=false;$("phoneGo").textContent="☎";
}
$("pad").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.k==="⌫")pinIn.value=pinIn.value.slice(0,-1);
  else if(pinIn.value.length<len)pinIn.value+=b.dataset.k;
  paint();check();
});
pinIn.addEventListener("input",()=>{pinIn.value=pinIn.value.replace(/\D/g,"").slice(0,len);paint();check()});
document.addEventListener("keydown",e=>{if(dlg.open&&/^\d$/.test(e.key)&&document.activeElement!==pinIn){pinIn.value=(pinIn.value+e.key).slice(0,len);paint();check()}});
$("pinCancel").onclick=()=>dlg.close();
$("phoneRow").addEventListener("click",e=>{
  if(e.target.closest("#phoneCopy")){copyText(CONFIG.phone,$("phoneCopy"));return}
  unlocked?(location.href="tel:"+CONFIG.phone):openPin();
});

/* Share */
$("shareBtn").onclick=async()=>{
  const url=CONFIG.pageUrl||location.href;
  if(navigator.share){try{await navigator.share({title:CONFIG.nameFa,url})}catch(e){}return}
  copyText(url);
};

/* Save contact */
$("saveBtn").onclick=()=>{
  if(!unlocked){toast("اول قفل شماره رو باز کن");openPin();return}
  const v=["BEGIN:VCARD","VERSION:3.0","FN:"+CONFIG.nameFa,"N:;"+CONFIG.nameFa+";;;","TEL;TYPE=CELL:"+CONFIG.phone,
    "URL;TYPE=Instagram:"+igUrl,"URL;TYPE=Telegram:"+tgUrl,"URL;TYPE=Telegram Channel:"+chUrl,"END:VCARD"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download="amir-taha.vcf";
  document.body.appendChild(a);a.click();a.remove();toast("فایل مخاطب ذخیره شد");
};
</script>
</body>
</html>
